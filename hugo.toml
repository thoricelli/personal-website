title = "Thor's website"
copyright = 'Copyright Thoricelli. All rights reserved.'
baseURL = 'https://thorgoesdevving.com/'
locale = 'en-us'
publishDir = ".cache/public"

enableGitInfo = true

disableKinds = ['taxonomy', 'term']

[minify]
  minifyOutput = true

[minify.tdewolff.html]
  keepWhitespace = false
  keepComments = false

[params]
  author = 'thoricelli'
  subtitle = "The personal website and blog of thoricelli. Explore my portfolio or my articles of what I'm working on, thinking about and discovering!"

[outputs]
  home = ['html', 'rss']

[markup.tableOfContents]
  startLevel = 1
  endLevel = 6


[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    noClasses = false
    lineNumbersInTable = false
    style = "monokai"
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$', '$']]
          inline = [['\(', '\)']]
      [markup.goldmark.extensions.typographer]
        disable = true

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = -1